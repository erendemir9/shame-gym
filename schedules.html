<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.H.A.M.E Gym — Schedules</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/motion.css" />

  <!-- GUARDS: need a session; every role may view Schedules. -->
  <script src="js/auth.js"></script>
  <script>requireAuth(); requirePageAccess("schedules");</script>
</head>
<body>
  <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" id="sidebarToggle" aria-label="Open navigation menu">☰ Menu</button>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
        <span class="wordmark">S.H.A.M.E</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-user">
        <div class="user-name" id="sidebarUserName">—</div>
        <span class="badge badge-silver" id="sidebarUserRole">—</span>
        <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn" style="margin-top:12px;">Log out</button>
      </div>
    </aside>

    <main class="main page-enter">
      <div class="page-header">
        <div>
          <h1>Schedules</h1>
          <p class="subtitle" id="schedulesSubtitle">Create class sessions and view the timetable.</p>
        </div>
        <button class="btn btn-primary" id="addClassBtn">+ Create class</button>
      </div>

      <!-- The table body is filled by renderSchedules() from localStorage. -->
      <div class="table-wrap">
        <table>
          <thead id="schedulesTableHead">
            <tr>
              <th>Class</th>
              <th>Trainer</th>
              <th>Date</th>
              <th>Time</th>
              <th>Duration</th>
              <th>Spots</th>
            </tr>
          </thead>
          <tbody id="schedulesBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- CREATE CLASS MODAL (hidden until opened). -->
  <div class="modal-backdrop" id="classModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="classModalTitle">
      <div class="modal-head">
        <h2 id="classModalTitle">Create class</h2>
        <button class="modal-close" id="classModalClose" aria-label="Close">&times;</button>
      </div>

      <form id="classForm" novalidate>
        <div class="field">
          <label for="cName">Class name</label>
          <input type="text" id="cName" placeholder="e.g. Spinning Burn" />
          <span class="field-error" id="cNameError"></span>
        </div>
        <div class="field">
          <label for="cTrainer">Trainer</label>
          <!-- Options are filled from the trainers saved in localStorage. -->
          <select id="cTrainer">
            <option value="">Select a trainer…</option>
          </select>
          <span class="field-error" id="cTrainerError"></span>
        </div>
        <div class="field">
          <label for="cDate">Date</label>
          <input type="date" id="cDate" />
          <span class="field-error" id="cDateError"></span>
        </div>
        <div class="field">
          <label for="cTime">Time</label>
          <input type="time" id="cTime" />
          <span class="field-error" id="cTimeError"></span>
        </div>
        <div class="field">
          <label for="cDuration">Duration (minutes)</label>
          <input type="number" id="cDuration" min="1" placeholder="e.g. 45" />
          <span class="field-error" id="cDurationError"></span>
        </div>
        <div class="field">
          <label for="cCapacity">Capacity</label>
          <input type="number" id="cCapacity" min="1" placeholder="e.g. 20" />
          <span class="field-error" id="cCapacityError"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="classCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save class</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CLASS ROSTER MODAL (admin + trainer). -->
  <div class="modal-backdrop" id="rosterModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rosterModalTitle">
      <div class="modal-head">
        <div>
          <h2 id="rosterModalTitle">Class roster</h2>
          <p class="subtitle" id="rosterModalSubtitle" style="margin-top:4px;"></p>
        </div>
        <button class="modal-close" id="rosterModalClose" aria-label="Close">&times;</button>
      </div>
      <div id="rosterBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/enrollments.js?v=20260628"></script>
  <script src="js/toast.js"></script>
  <script src="js/schedules.js?v=20260628"></script>
  <script>
    mountSidebar("schedules"); // sidebar adapts to the role
    initSchedulePage();        // wire (admin) or strip (read-only) management UI

    function startSchedulesPage() {
      var enrollmentLoad = typeof loadEnrollmentsWithFallback === "function"
        ? loadEnrollmentsWithFallback()
        : Promise.resolve();
      var trainerLoad = typeof loadTrainerOptionsWithFallback === "function"
        ? loadTrainerOptionsWithFallback()
        : Promise.resolve();

      Promise.all([enrollmentLoad, trainerLoad]).then(function () {
        if (typeof loadClassesWithFallback === "function") {
          loadClassesWithFallback();
        } else {
          renderSchedules();
        }
      });
    }

    startSchedulesPage();
  </script>
  <script src="js/ui-enhancements.js"></script>
</body>
</html>
