<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.H.A.M.E Gym — Trainers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/motion.css" />

  <!-- GUARDS: need a session, and the role must be allowed to see Trainers. -->
  <script src="js/auth.js"></script>
  <script>requireAuth(); requirePageAccess("trainers");</script>
</head>
<body>
  <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" id="sidebarToggle" aria-label="Open navigation menu">☰ Menu</button>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
        <span class="wordmark">S.H.A.M.E</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-user">
        <div class="user-name" id="sidebarUserName">—</div>
        <span class="badge badge-silver" id="sidebarUserRole">—</span>
        <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn" style="margin-top:12px;">Log out</button>
      </div>
    </aside>

    <main class="main page-enter">
      <div class="page-header">
        <div>
          <h1>Trainers</h1>
          <p class="subtitle">Add trainers and view the coaching team.</p>
        </div>
        <button class="btn btn-primary" id="addTrainerBtn">+ Add trainer</button>
      </div>

      <!-- Cards are filled by renderTrainers() from localStorage. -->
      <div class="cards-grid reveal-group" id="trainersGrid"></div>
    </main>
  </div>

  <!-- ADD TRAINER MODAL (hidden until opened). -->
  <div class="modal-backdrop" id="trainerModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="trainerModalTitle">
      <div class="modal-head">
        <h2 id="trainerModalTitle">Add trainer</h2>
        <button class="modal-close" id="trainerModalClose" aria-label="Close">&times;</button>
      </div>

      <form id="trainerForm" novalidate>
        <div class="field">
          <label for="tName">Full name</label>
          <input type="text" id="tName" placeholder="e.g. Marcus Hale" />
          <span class="field-error" id="tNameError"></span>
        </div>
        <div class="field">
          <label for="tEmail">Email</label>
          <input type="text" id="tEmail" placeholder="e.g. marcus@shame.gym" />
          <span class="field-error" id="tEmailError"></span>
        </div>
        <div class="field">
          <label for="tPhone">Phone number</label>
          <div class="phone-field">
            <select id="tPhoneCountry" class="phone-country" aria-label="Country code"></select>
            <input type="tel" id="tPhone" placeholder="202 555 0143" inputmode="tel" autocomplete="tel-national" />
          </div>
          <span class="field-hint" id="tPhoneHint">US: 202 555 0143</span>
          <span class="field-error" id="tPhoneError"></span>
        </div>
        <div class="field">
          <label for="tSpec">Specialization</label>
          <select id="tSpec">
            <option value="">Select a specialization…</option>
            <option value="Strength">Strength</option>
            <option value="Cardio">Cardio</option>
            <option value="CrossFit">CrossFit</option>
            <option value="Yoga">Yoga</option>
            <option value="Boxing">Boxing</option>
          </select>
          <span class="field-error" id="tSpecError"></span>
        </div>
        <div class="field">
          <label for="tAvail">Availability</label>
          <select id="tAvail">
            <option value="">Select availability…</option>
            <option value="Morning">Morning</option>
            <option value="Evening">Evening</option>
            <option value="Weekend">Weekend</option>
            <option value="Full-time">Full-time</option>
          </select>
          <span class="field-error" id="tAvailError"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="trainerCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save trainer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/trainers.js"></script>
  <script>
    mountSidebar("trainers"); // sidebar adapts to the role
    initTrainerPage();        // wire (admin) or strip (read-only) management UI
    renderTrainers();         // draw the cards on load
  </script>
  <script src="js/ui-enhancements.js"></script>
</body>
</html>
