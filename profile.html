<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.H.A.M.E Gym — My Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/motion.css" />

  <script src="js/auth.js"></script>
  <script>requireAuth(); requirePageAccess("profile");</script>
</head>
<body>
  <button type="button" class="btn btn-ghost btn-sm sidebar-toggle" id="sidebarToggle" aria-label="Open navigation menu">☰ Menu</button>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
        <span class="wordmark">S.H.A.M.E</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-user">
        <div class="user-name" id="sidebarUserName">—</div>
        <span class="badge badge-silver" id="sidebarUserRole">—</span>
        <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn" style="margin-top:12px;">Log out</button>
      </div>
    </aside>

    <main class="main page-enter">
      <div class="page-header">
        <div>
          <h1>My Profile</h1>
          <p class="subtitle">Keep your personal information up to date.</p>
        </div>
      </div>

      <section class="card" style="max-width:560px;">
        <form id="profileForm" novalidate>
          <div class="field">
            <label for="pfName">Full name</label>
            <input type="text" id="pfName" placeholder="Your name" />
            <span class="field-error" id="pfNameError"></span>
          </div>
          <div class="field">
            <label for="pfEmail">Email</label>
            <input type="text" id="pfEmail" placeholder="your.email@example.com" />
            <span class="field-error" id="pfEmailError"></span>
          </div>
          <div class="field">
            <label for="pfPhone">Phone number</label>
            <div class="phone-field">
              <select id="pfPhoneCountry" class="phone-country" aria-label="Country code"></select>
              <input type="tel" id="pfPhone" placeholder="202 555 0143" inputmode="tel" autocomplete="tel-national" />
            </div>
            <span class="field-hint" id="pfPhoneHint">US: 202 555 0143</span>
            <span class="field-error" id="pfPhoneError"></span>
          </div>

          <div class="field">
            <label>Membership type</label>
            <div id="pfMembershipReadonly" class="subtitle">—</div>
          </div>
          <div class="field">
            <label>Member since</label>
            <div id="pfStartReadonly" class="subtitle">—</div>
          </div>

          <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-ghost" href="dashboard.html">Back to dashboard</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
  <script>
    mountSidebar("profile");
    initProfilePage();
  </script>
  <script src="js/ui-enhancements.js"></script>
</body>
</html>
