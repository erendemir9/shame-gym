<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.H.A.M.E Gym — Login</title>

  <!-- Google Fonts: Barlow Condensed (display) + Inter (body). Only allowed external resource. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SPLASH INTRO: full-screen overlay shown once per browser session.
       Click anywhere to skip. Animations are pure CSS; JS only times the fade-out. -->
  <div class="splash" id="splash">
    <img src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
    <p class="splash-tagline">Strength · Health · Athletics · Motivation · Excellence</p>
    <span class="splash-skip">Click anywhere to skip</span>
  </div>

  <!-- LOGIN CARD -->
  <main class="login-wrap">
    <section class="login-card page-enter">
      <img class="login-logo" src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
      <h1>Welcome Back</h1>
      <p class="login-sub">Members Area</p>

      <!-- Banner shown by JS when credentials are wrong (wired in IAP-25). -->
      <div class="form-error" id="loginError"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email or username</label>
          <input type="text" id="email" name="email" placeholder="admin@shame.gym" autocomplete="username" />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <!-- Collapsible demo credentials for the university demo. -->
      <details class="demo-hint">
        <summary>Demo credentials</summary>
        <ul>
          <li><code>admin@shame.gym</code> / <code>admin123</code></li>
          <li><code>trainer@shame.gym</code> / <code>trainer123</code></li>
          <li><code>member@shame.gym</code> / <code>member123</code></li>
        </ul>
      </details>
    </section>
  </main>

  <!-- Splash timing logic: play once per session, allow skip. -->
  <script>
    (function () {
      var splash = document.getElementById("splash");

      // Hide the splash and remember we played it for this session.
      function dismissSplash() {
        splash.classList.add("hide");
        sessionStorage.setItem("shame_splash_played", "yes");
        // Remove from the DOM after the fade so it never blocks clicks.
        setTimeout(function () { splash.style.display = "none"; }, 600);
      }

      // If it already played this session, skip straight to the login card.
      if (sessionStorage.getItem("shame_splash_played")) {
        splash.style.display = "none";
      } else {
        // Auto-dismiss after ~2.5s, or sooner if the user clicks.
        setTimeout(dismissSplash, 2500);
        splash.addEventListener("click", dismissSplash);
      }
    })();
  </script>
</body>
</html>
