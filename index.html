<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.H.A.M.E Gym — Login</title>

  <!-- Google Fonts: Barlow Condensed (display) + Inter (body). Only allowed external resource. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SPLASH INTRO: full-screen overlay shown once per browser session.
       Click anywhere to skip. Animations are pure CSS; JS only times the fade-out. -->
  <div class="splash" id="splash">
    <img src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
    <p class="splash-tagline">Strength · Health · Athletics · Motivation · Excellence</p>
    <span class="splash-skip">Click anywhere to skip</span>
  </div>

  <!-- LOGIN CARD -->
  <main class="login-wrap">
    <section class="login-card page-enter">
      <img class="login-logo" src="assets/logo.jpeg" alt="S.H.A.M.E logo" />
      <h1>Welcome Back</h1>
      <p class="login-sub">Members Area</p>

      <!-- Banner shown by JS when credentials are wrong (wired in IAP-25). -->
      <div class="form-error" id="loginError"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email or username</label>
          <input type="text" id="email" name="email" placeholder="admin@shame.gym" autocomplete="username" />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <span class="field-error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <!-- Collapsible demo credentials for the university demo. -->
      <details class="demo-hint">
        <summary>Demo credentials</summary>
        <ul>
          <li><code>admin@shame.gym</code> / <code>admin123</code></li>
          <li><code>trainer@shame.gym</code> / <code>trainer123</code></li>
          <li><code>member@shame.gym</code> / <code>member123</code></li>
        </ul>
      </details>
    </section>
  </main>

  <script src="js/auth.js"></script>

  <!-- LOGIN LOGIC: validate the two fields, then check credentials. -->
  <script>
    (function () {
      // If already logged in, skip the login page and go to the dashboard.
      if (getSession()) {
        window.location.replace("dashboard.html");
        return;
      }

      var form = document.getElementById("loginForm");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var formError = document.getElementById("loginError");

      // Show a red message under one field + shake it.
      function setFieldError(input, errorEl, message) {
        errorEl.textContent = message;
        errorEl.classList.add("show");
        input.classList.add("invalid");
        // Restart the shake animation each time it is triggered.
        input.classList.remove("shake");
        void input.offsetWidth; // reflow so the animation replays
        input.classList.add("shake");
      }

      // Clear the error state for one field.
      function clearFieldError(input, errorEl) {
        errorEl.textContent = "";
        errorEl.classList.remove("show");
        input.classList.remove("invalid");
      }

      // Validate that both fields are filled. Returns true if the form is OK.
      function validateLoginForm() {
        var ok = true;
        clearFieldError(emailInput, document.getElementById("emailError"));
        clearFieldError(passwordInput, document.getElementById("passwordError"));

        if (emailInput.value.trim() === "") {
          setFieldError(emailInput, document.getElementById("emailError"), "Email is required.");
          ok = false;
        }
        if (passwordInput.value.trim() === "") {
          setFieldError(passwordInput, document.getElementById("passwordError"), "Password is required.");
          ok = false;
        }
        return ok;
      }

      // Handle the submit: validate, check credentials, then save + redirect.
      form.addEventListener("submit", function (event) {
        event.preventDefault();          // stop the browser's default submit
        formError.classList.remove("show");

        if (!validateLoginForm()) return; // empty fields: stop here

        var user = findUser(emailInput.value.trim(), passwordInput.value);
        if (!user) {
          // Wrong email or password: show the banner.
          formError.textContent = "Invalid email or password. Please try again.";
          formError.classList.add("show");
          return;
        }

        // Success: store the session and go to the dashboard.
        saveSession(user);
        window.location.replace("dashboard.html");
      });

      // Clear a field's error as soon as the user types in it.
      emailInput.addEventListener("input", function () {
        clearFieldError(emailInput, document.getElementById("emailError"));
      });
      passwordInput.addEventListener("input", function () {
        clearFieldError(passwordInput, document.getElementById("passwordError"));
      });
    })();
  </script>

  <!-- Splash timing logic: play once per session, allow skip. -->
  <script>
    (function () {
      var splash = document.getElementById("splash");

      // Hide the splash and remember we played it for this session.
      function dismissSplash() {
        splash.classList.add("hide");
        sessionStorage.setItem("shame_splash_played", "yes");
        // Remove from the DOM after the fade so it never blocks clicks.
        setTimeout(function () { splash.style.display = "none"; }, 600);
      }

      // If it already played this session, skip straight to the login card.
      if (sessionStorage.getItem("shame_splash_played")) {
        splash.style.display = "none";
      } else {
        // Auto-dismiss after ~2.5s, or sooner if the user clicks.
        setTimeout(dismissSplash, 2500);
        splash.addEventListener("click", dismissSplash);
      }
    })();
  </script>
</body>
</html>
